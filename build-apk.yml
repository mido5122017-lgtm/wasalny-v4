name: Build Wasalny APK - وصلني سيدي سالم

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || echo "No gradlew, will use gradle"

      - name: Build APK with Gradle
        uses: gradle/gradle-build-action@v2
        with:
          arguments: |
            :app:assembleDebug
          build-root-directory: .
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

      - name: Fallback build (if gradlew not found)
        if: failure()
        run: |
          cd app
          gradle assembleDebug || ./gradlew assembleDebug
        continue-on-error: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wasalny-v4-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Create Release with APK
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v4.0-${{ github.run_number }}
          name: "وصلني V4 - ${{ github.run_number }}"
          body: |
            🕌 وصلني - سيدي سالم - شبكة أمان سيدي سالم
            - 5 تبويبات منظمة بدون لخبطة
            - خرائط جوجل 100%
            - روحني البيت بضغطة واحدة
            - وضع الستات الآمن + بدون نت SMS
            - APK جاهز للتثبيت
          files: |
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}